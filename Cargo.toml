[package]
name = "ringlink"
version = "5.0.0"
edition = "2021"
license-file = "LICENSE"
description = "Proximity voice chat for Le Mans Ultimate and BeamNG.drive"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
hex = "0.4"
opus = "0.3"
nnnoiseless = { version = "0.5", default-features = false }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
arboard = { version = "3", default-features = false }
png = "0.17"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Multimedia", "Win32_Media"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
libc = "0.2"

[features]
fakeaudio = []

[profile.release]
opt-level = 3
lto = "thin"
strip = true
